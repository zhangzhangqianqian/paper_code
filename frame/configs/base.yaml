project:
  name: dynamic_directed_multienergy_forecasting
  version: kitakyushu_stage5

data:
  dataset: kitakyushu_energy_station
  aggregation_level: energy_station
  raw_data_dir: Kitakyushu dataset
  canonical_file: frame/reports/data_audit/kitakyushu/cleaned_canonical.csv
  report_dir: frame/reports/data_audit/kitakyushu
  tasks:
    - electricity
    - cooling
    - heating
    - gas
  task_count: 4
  lookback: 24
  horizon: 4
  sampling: 1h
  split: chronological
  full_split:
    train: ["2015-01-01 00:00:00", "2019-12-31 23:00:00"]
    validation: ["2020-01-01 00:00:00", "2020-12-31 23:00:00"]
    test: ["2021-01-01 00:00:00", "2021-12-31 23:00:00"]
  small_sample_split:
    train: ["2018-07-01 00:00:00", "2018-08-17 23:00:00"]
    validation: ["2018-08-18 00:00:00", "2018-08-24 23:00:00"]
    test: ["2018-08-25 00:00:00", "2018-08-31 23:00:00"]
  exog_columns:
    - temperature
    - humidity
    - solar_irradiance
    - wind_speed
    - wind_direction
    - hour_sin
    - hour_cos
    - dow_sin
    - dow_cos
    - month_sin
    - month_cos
    - is_weekend

model:
  encoder: depthwise_separable_tcn
  hidden_dim: 32
  kernel_size: 3
  dilations:
    - 1
    - 2
  state_dim: 16
  task_embedding_dim: 8
  gate_hidden_dim: 16
  prediction_head_hidden_dim: 16
  dropout: 0.1
  gate_type: dynamic_directed
  fusion: residual_add

training:
  device: cpu
  torch_threads: 8
  seed: 2026
  optimizer: AdamW
  weight_decay: 0.0001
  grad_clip_norm: 1.0
  batch_size_full: 256
  batch_size_small_sample: 32
  max_epochs_full: 100
  max_epochs_small_sample: 200
  early_stopping_patience_full: 12
  early_stopping_patience_small_sample: 20

environment:
  python_executable: D:\anaconda\envs\pytorch\python.exe
  python_version: "3.9.25"
  pytorch_version: "2.8.0+cpu"
